name: Release to TestFlight

# Archives a signed Release build and uploads it to TestFlight.
# Triggers:
#   - pushing a version tag (v1.0.0, v1.2.3, ...)
#   - manual run from the Actions tab (optionally with a build-number override)
#
# This workflow will FAIL until the four repository secrets below are configured
# (Settings -> Secrets and variables -> Actions). It does not touch project.yml,
# so the simulator build/test workflow (ios-ci.yml) is unaffected.
#
# Required secrets:
#   ASC_KEY_ID        App Store Connect API key ID
#   ASC_ISSUER_ID     App Store Connect API issuer ID
#   ASC_KEY_CONTENT   base64 of the AuthKey_XXXX.p8  (base64 -i AuthKey_XXXX.p8 | pbcopy)
#   DEVELOPMENT_TEAM  Apple Developer team ID (e.g. 796XH483R4)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override (defaults to the run number)"
        required: false

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare App Store Connect authentication
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT DEVELOPMENT_TEAM; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

          xcode_major="$(xcodebuild -version | awk 'NR == 1 { split($2, parts, \".\"); print parts[1] }')"
          if [[ "$xcode_major" -lt 26 ]]; then
            echo "::error::Xcode 26 or newer is required for App Store Connect uploads."
            exit 1
          fi

          umask 077
          key_path="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_CONTENT" | base64 -D > "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
        run: bundle exec fastlane beta
